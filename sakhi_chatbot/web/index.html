<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakhi – Caring Health Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Hind:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="app-page">
      <header class="topbar">
        <div class="brand">
          <div class="mark">🌸</div>
          <div class="titles">
            <h1>Sakhi</h1>
            <span class="sub">Care with empathy</span>
          </div>
        </div>
        <div class="topbar-center">
          <div class="status-pill" id="status-pill">Ready</div>
          <small class="status-caption" id="status-caption">Speak or type and I will reply in your language.</small>
        </div>
        <div class="actions">
          <button id="theme-btn" class="ghost" title="Theme">🌓</button>
          <button id="restart-btn" class="restart" title="Restart session">↺ Restart</button>
        </div>
      </header>

      <main class="chat-container" id="chat-window">
        <ul class="message-list" id="message-list"></ul>
        <div class="typing-indicator" id="typing-indicator"><span></span><span></span><span></span></div>
        <button id="scroll-bottom" class="fab" title="Jump to latest">⬇️</button>
      </main>

      <section class="composer">
        <div id="quick-replies" class="quick-replies" aria-live="polite"></div>
        <div class="input-row">
          <textarea id="text-input" placeholder="Write your message here…" rows="2"></textarea>
          <button id="send-btn" class="primary">Send</button>
        </div>
        <div class="voice-row">
          <button id="talk-btn" class="voice primary">
            <span class="pulse"></span>
            <span class="icon">🎤</span>
            <span class="label">Talk</span>
          </button>
          <button id="stop-btn" class="voice" disabled>
            <span class="icon">⏹</span>
            <span class="label">Stop</span>
          </button>
        </div>
      </section>
    </div>

    <template id="message-template">
      <li class="message">
        <div class="avatar"></div>
        <div class="bubble">
          <div class="meta"></div>
          <div class="text"></div>
        </div>
      </li>
    </template>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
